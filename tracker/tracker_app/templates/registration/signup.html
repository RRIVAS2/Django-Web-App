{% extends "tracker_app/base.html" %}

{% block content %}

    <h2>Create New Account</h2>

    <form method="post">
    {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <button type="submit">Sign Up</button>
    </form>

    <p>Already have an account? <a href="{% url 'login' %}">Log in here</a></p>
{% endblock %}
